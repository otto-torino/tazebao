{% extends "admin/base_site.html" %}
{% comment %}
Extends django-baton's admin/base_site.html (next in the template loaders chain)
adding only what Tazebao needs, so it keeps working across baton upgrades.
{% endcomment %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link href="https://fonts.googleapis.com/css?family=Dosis:300,400,700" rel="stylesheet">
    <script>window.CKEDITOR_BASEPATH = '{% static "ckeditor/ckeditor/" %}';</script>
{% endblock %}
